name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  release:
    needs: test
    uses: osaurus-ai/osaurus-tools/.github/workflows/build-plugin.yml@015ade6cda1840d81929f0080fc5d8c1371bfe16
    permissions:
      contents: write
    secrets: inherit
