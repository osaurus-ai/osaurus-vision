name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: List tests (discovery only)
        timeout-minutes: 5
        run: swift test list
      - name: Conformance tests (no Vision framework calls)
        timeout-minutes: 5
        run: swift test --filter SDKConformanceTests
      - name: Full suite
        timeout-minutes: 10
        run: swift test --parallel
